[package]
name = "appkit"
version = "0.1.0"
edition = "2021"
authors = ["soundadam"]
repository = "https://github.com/soundadam/appkit"
license = "MIT OR Apache-2.0"
description = "Version, install source, update checks and self-update for soundadam desktop apps"

[features]
# 现成的 egui 控件：顶栏更新提示与设置项
egui = ["dep:egui"]

[dependencies]
dirs = "6"
egui = { version = "0.29", default-features = false, optional = true }
flate2 = "1"
self-replace = "1"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
ureq = { version = "3", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Console"] }
